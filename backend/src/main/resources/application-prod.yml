# Production profile. Required values have no defaults, so a missing variable stops startup
# instead of silently falling back to a development value.

spring:
  datasource:
    url: ${APIFORGE_DB_URL}
    username: ${APIFORGE_DB_USER}
    password: ${APIFORGE_DB_PASSWORD}

apiforge:
  auth:
    # Production is served over HTTPS: cookies must not travel over plain HTTP.
    secure-cookies: ${APIFORGE_COOKIE_SECURE:true}

logging:
  structured:
    format:
      console: ecs
