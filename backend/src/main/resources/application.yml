# Base configuration shared by all profiles. Production-safe defaults live here;
# convenience settings for local development live in application-dev.yml.
# Every value that differs per environment is read from an environment variable.

spring:
  application:
    name: apiforge-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${APIFORGE_DB_URL:jdbc:postgresql://localhost:${APIFORGE_DB_PORT:5432}/${APIFORGE_DB_NAME:apiforge}}
    username: ${APIFORGE_DB_USER:apiforge}
    password: ${APIFORGE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${APIFORGE_DB_POOL_SIZE:10}
      connection-timeout: 5000 # milliseconds
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      # Test generation writes hundreds of rows per request; ids are generated in the
      # application (UUIDv7), so inserts and updates can be sent in batches.
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Uploaded OpenAPI documents; keep in sync with apiforge.specification.max-size.
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      pageable:
        default-page-size: 20
        # Larger requested sizes are capped to this value.
        max-page-size: 100

server:
  port: ${APIFORGE_SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    # Let Tomcat read (and discard) oversized uploads up to this size so the client receives a
    # proper 413 response instead of a reset connection.
    max-swallow-size: 20MB
  servlet:
    session:
      timeout: ${APIFORGE_SESSION_IDLE_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        name: APIFORGE_SESSION
        http-only: true
        same-site: lax
        secure: ${apiforge.auth.secure-cookies}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  info:
    build:
      enabled: true

apiforge:
  cors:
    allowed-origins: ${APIFORGE_CORS_ALLOWED_ORIGINS:}
  auth:
    registration-enabled: ${APIFORGE_AUTH_REGISTRATION_ENABLED:true}
    max-failed-attempts: 5
    lockout-duration: 15m
    absolute-session-timeout: ${APIFORGE_SESSION_ABSOLUTE_TIMEOUT:12h}
    login-requests-per-minute: 10
    registration-requests-per-minute: 5
    secure-cookies: ${APIFORGE_COOKIE_SECURE:false}
  specification:
    max-size: ${APIFORGE_SPEC_MAX_SIZE:5MB}
    max-operations: 2000
    max-nesting-depth: 100
    max-yaml-aliases: 50

logging:
  pattern:
    # Adds the request correlation id to every log line.
    level: "%5p [%X{requestId:-}]"
