# Test profile (activated by @IntegrationTest). The database comes from Testcontainers.

apiforge:
  ai:
    # A fake Ollama on loopback (support/FakeOllama); individual tests decide how it answers.
    base-url: http://127.0.0.1:18092
    model: test-model:1b
    request-timeout: 3s
    status-timeout: 2s
    queue-wait: 200ms
    requests-per-minute-per-user: 120
  secrets:
    key: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nLWtleSE=
  outbound:
    # Integration tests run their target servers on these loopback ports only.
    trusted-targets-enabled: true
    trusted-targets:
      - host: 127.0.0.1
        port: 18090
      - host: localhost
        port: 18090
      - host: 127.0.0.1
        port: 18091
    connect-timeout: 2s
    total-deadline: 5s
    max-response-size: 64KB
    stored-body-size: 16KB
    max-redirects: 3
    max-concurrent-runs-per-user: 2
    requests-per-minute-per-user: 6000
  auth:
    # Minimum bcrypt cost keeps the many registrations in tests fast; hashing is still real bcrypt.
    bcrypt-strength: 4
    # High enough that the shared test context never trips the per-IP limits by accident;
    # dedicated tests lower them.
    login-requests-per-minute: 10000
    registration-requests-per-minute: 10000
