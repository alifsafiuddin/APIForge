name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, tests, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # GitHub-hosted Ubuntu runners include Docker, which Testcontainers uses for PostgreSQL.
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  compose:
    name: Docker Compose configuration (database for development)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start PostgreSQL alone, as for development from source
        env:
          APIFORGE_DB_PASSWORD: ci-only-password
        run: |
          docker compose config --quiet
          docker compose up -d --wait postgres
          docker compose exec -T postgres pg_isready -U apiforge -d apiforge
          docker compose down -v

  stack:
    name: Images, complete stack and end-to-end tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          tags: apiforge-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build the frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          tags: apiforge-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Start the stack from a clean environment (secrets generated for this run only)
        run: |
          {
            echo "APIFORGE_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "APIFORGE_SECRETS_KEY=$(openssl rand -base64 32)"
            echo "APIFORGE_COOKIE_SECURE=false"
            echo "APIFORGE_AI_ENABLED=false"
            echo "APIFORGE_DEMO_TARGET_ENABLED=true"
            echo "APIFORGE_IMAGE_TAG=ci"
          } > .env
          docker compose --profile demo up -d --no-build --wait --wait-timeout 300
      - name: Health, migrations and closed management endpoints
        run: |
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/env)" = 404
          test "$(docker compose exec -T postgres psql -U apiforge -d apiforge -Atc             "select count(*) from flyway_schema_history where success and version is not null")" -ge 13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: End-to-end tests against the stack (AI disabled)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_LAB_URL: http://warehouse-lab:8090
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Container logs
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
      - name: Stop and remove the stack
        if: always()
        run: docker compose --profile demo down -v
